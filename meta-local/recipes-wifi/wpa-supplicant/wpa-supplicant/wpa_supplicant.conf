# Orange Pi 3 / AP6256 — working SSIDs and band policy.
#
# Problems reflected here and in wifi-connect / wifi-roam:
# - Need both networks: Chuck Norris (2.4) and Chuck Norris_5G (different PSKs).
# - priority= is only a soft hint for the *first* association; ongoing band
#   choice is wifi-roam comparing measured RSSI (with dB margin hysteresis).
# - bgscan: scan more often when RSSI < -70 so roam has fresh scan_results.
# - scan_ssid=1: hidden SSID / odd beacon cases.
# - Explicit key_mgmt/proto/pairwise: fewer surprises with mixed WPA/WPA2 APs.
# - Do not pin a network via select_network from wifi-connect: that disables
#   the other band and fights wifi-roam.
#
# RF/HDMI: loading sun4i_drm after COMPLETED dropped the 2.4 GHz link — not
# fixed by this conf; the image must not autoload DRM on a WiFi-first boot.

ctrl_interface=DIR=/var/run/wpa_supplicant
update_config=1
ap_scan=1
country=RU
bgscan="simple:30:-70:300"

network={
	ssid="Chuck Norris_5G"
	psk="yamahaxjr1300"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP TKIP
	scan_ssid=1
	priority=10
}

network={
	ssid="Chuck Norris"
	psk="yamahaxjr"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP TKIP
	scan_ssid=1
	priority=10
}
