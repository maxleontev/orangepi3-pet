# Orange Pi 3 / AP6256 — WiFi settings on /data.
# Populated via setup AP web UI or wifi-write-config.
# Empty file (no network{} blocks) → device starts setup AP at boot.
#
# Setup AP address (captive portal / DHCP gateway). Change and restart wifi.service.
# setup_ap_ip=192.168.4.1
# setup_ap_prefix=24

ctrl_interface=DIR=/var/run/wpa_supplicant
update_config=1
ap_scan=1
country=RU
bgscan="simple:30:-70:300"
