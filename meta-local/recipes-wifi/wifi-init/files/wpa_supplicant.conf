# Orange Pi 3 / AP6256 — WiFi networks on /data (writable; survives A/B rootfs
# swaps). Installed to /data/wpa_supplicant.conf at image build time.
# Edit on device: vi /data/wpa_supplicant.conf && systemctl restart wifi.service
#
# Band policy (wifi-connect / wifi-roam):
# - priority= is only a soft hint for the *first* association; ongoing band
#   choice is wifi-roam comparing measured RSSI (with dB margin hysteresis).
# - bgscan: scan more often when RSSI < -70 so roam has fresh scan_results.
# - scan_ssid=1: hidden SSID / odd beacon cases.
# - Do not pin a network via select_network from wifi-connect: that disables
#   the other band and fights wifi-roam.

ctrl_interface=DIR=/var/run/wpa_supplicant
update_config=1
ap_scan=1
country=RU
bgscan="simple:30:-70:300"

network={
	ssid="Chuck Norris_5G"
	psk="yamahaxjr1300"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP TKIP
	scan_ssid=1
	priority=10
}

network={
	ssid="Chuck Norris"
	psk="yamahaxjr"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP TKIP
	scan_ssid=1
	priority=10
}
