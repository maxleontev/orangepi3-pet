# Orange Pi 3 onboard analog mic / 3.5 mm jack via AC200 + H6 I2S3.

CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SIMPLE_CARD=y
CONFIG_SND_SUN4I_I2S=m

CONFIG_PWM=y
CONFIG_PWM_SUN4I=y
CONFIG_COMMON_CLK_PWM=y

# I2S PCM uses the Allwinner DMA engine (otherwise sun4i-i2s defers forever).
CONFIG_DMADEVICES=y
CONFIG_DMA_SUN6I=y

CONFIG_MFD_AC200=m
CONFIG_SND_SOC_AC200_CODEC=m
