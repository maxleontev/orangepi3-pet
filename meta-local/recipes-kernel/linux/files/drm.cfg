# Mainline DRM + Lima for Allwinner H6 (Orange Pi 3).
# Drivers as modules so probe issues cannot hang early boot/network.
# Panfrost must stay off — H6 Mali-T720 is Midgard (lima), not Bifrost.

CONFIG_DRM=m
CONFIG_DRM_KMS_HELPER=m
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_SUN4I=m
CONFIG_DRM_SUN8I_DW_HDMI=m
CONFIG_DRM_SUN8I_MIXER=m
CONFIG_DRM_SUN8I_TCON_TOP=m
CONFIG_DRM_LIMA=m
# CONFIG_DRM_PANFROST is not set

CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=128

# H6 THS → /sys/class/thermal/thermal_zone*
# Needs SID/efuse nvmem for thermal-sensor-calibration@14 (else deferred forever).
CONFIG_SUN8I_THERMAL=y
CONFIG_NVMEM_SUNXI_SID=y
