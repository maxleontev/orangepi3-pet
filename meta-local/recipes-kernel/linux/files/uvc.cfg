# USB Video Class (Logitech and other UVC webcams) for info-panel-camera.
# Mainline aarch64 defconfig leaves MEDIA_USB_SUPPORT off, so /dev/video*
# never appears for USB cameras without this fragment.

CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_VIDEO_DEV=m
CONFIG_USB_VIDEO_CLASS=m
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
