# Orange Pi 3: HDMI/display DRM autoloads via DT modalias and its pixel
# clock RF noise drops the AP6256 2.4 GHz association shortly after boot
# (wifi-connect reaches COMPLETED, then wlan0 falls to SCANNING/operstate=down).
# Blacklist prevents udev autoload; "modprobe sun4i_drm" still works for Weston.

blacklist sun4i_drm
blacklist sun8i_mixer
blacklist sun8i_drm_hdmi
blacklist sun4i_tcon
blacklist sun8i_tcon_top
blacklist lima
blacklist dw_hdmi
blacklist dw_hdmi_i2s_audio
blacklist display_connector
