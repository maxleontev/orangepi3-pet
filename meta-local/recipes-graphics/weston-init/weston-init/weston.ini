# Kiosk-style Weston for the HDMI info panel (DRM/KMS + Mesa Lima).
# idle-time=0 is also injected by PACKAGECONFIG no-idle-timeout.

[core]
backend=drm-backend.so
require-input=false
repaint-window=16
# Cairo/wl_shm panel: GL/Lima compositing pegged a core and reset the H6.
use-pixman=true

[shell]
locking=false
panel-position=none
startup-animation=none
clock-format=minutes
background-color=0xff0b1220

[output]
name=HDMI-A-1
mode=preferred
