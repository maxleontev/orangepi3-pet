#@TYPE: Machine
#@NAME: orange-pi-3
#@DESCRIPTION: Orange Pi 3 (Allwinner H6, without LTS suffix).
#              Reuses the orange-pi-3lts BSP from meta-sunxi for the H6 base,
#              but uses the non-LTS DTB/U-Boot and AP6256 (brcmfmac) WiFi —
#              the LTS board uses a different UWE5622 module.

require conf/machine/orange-pi-3lts.conf

# Override DTB: non-LTS board uses sun50i-h6-orangepi-3.dtb
KERNEL_DEVICETREE = "allwinner/sun50i-h6-orangepi-3.dtb"

# Override U-Boot defconfig: upstream u-boot has a dedicated defconfig for
# the non-LTS Orange Pi 3.
UBOOT_MACHINE = "orangepi_3_defconfig"

# arm64 Image must be 2 MiB-aligned; meta-sunxi defaults to 0x40008000 which
# triggers "Kernel image misaligned at boot" with FIT/bootm.
UBOOT_ENTRYPOINT = "0x40000000"
UBOOT_LOADADDRESS = "0x40000000"

# Drop LTS UWE5622 WiFi/BT stack — Orange Pi 3 uses AP6256 (brcmfmac).
MACHINE_EXTRA_RRECOMMENDS:remove = "uwe5622-firmware"
KERNEL_MODULE_AUTOLOAD:remove = "sprdwl_ng"
KERNEL_MODULE_AUTOLOAD:remove = "sprdbt_tty"
KERNEL_MODULE_AUTOLOAD += " brcmfmac"
MACHINE_EXTRA_RRECOMMENDS += " kernel-module-brcmfmac"

# GPT image: boot (FAT) + rootfs (ext4 R/O) + data (F2FS). Firmware is at
# 128 KiB (past the GPT entry array). Boot/root use GPT names / PARTLABEL.
WKS_FILES = "orangepi3-sdcard.wks.in"
WKS_FILE_DEPENDS:append = " f2fs-tools-native"
